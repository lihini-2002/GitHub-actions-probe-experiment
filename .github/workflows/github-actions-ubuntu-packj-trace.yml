name: Environment Probe - GitHub Ubuntu + Packj Trace

# GitHub Ubuntu VM -> Packj `audit --trace` -> strace -> npm install -> probe.
# See experiments/packj/README.md for the design and every deviation from
# upstream Packj. Sandbox mode (`packj sandbox`) is not used here.
#
# Packj runs `npm install` with its own environment, which is the step's
# environment. As in latch-probe.yml, this workflow therefore sets no job-level
# `env:` and never writes to $GITHUB_ENV: anything placed there would be
# visible to the probe. Python is taken from the runner tool cache instead of
# actions/setup-python for the same reason (setup-python exports pythonLocation
# and friends). Experiment labels are given only to the metadata step.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packj-trace-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch pinned Packj sources
        run: |
          # Only this submodule: see latch-probe.yml for why actions/checkout
          # `submodules:` is not used in this repository.
          git submodule update --init --depth 1 tools/packj

      - name: Verify pinned Packj sources
        run: |
          expected=dfd2c70c4b6dde0327888d62fa7d3df0661d0dfc
          actual=$(git -C tools/packj rev-parse HEAD)
          if [ "$actual" != "$expected" ]; then
            echo "::error::tools/packj is at $actual, expected $expected"
            exit 1
          fi
          echo "tools/packj @ $actual"

      # Same Node.js setup as Experiment A (probe.yml); Packj runs whichever npm
      # is first on PATH.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Create experiment directories
        run: |
          mkdir -p experiment-output/metadata/checks
          mkdir -p experiment-output/probe
          mkdir -p experiment-output/packj/audit
          mkdir -p experiment-output/packj/trace
          mkdir -p experiment-output/packj/logs

      - name: Inspect versions
        run: |
          {
            echo "=== TIMESTAMP ==="
            date -u --iso-8601=seconds

            echo
            echo "=== GITHUB ACTIONS ==="
            echo "GITHUB_WORKFLOW=$GITHUB_WORKFLOW"
            echo "GITHUB_RUN_ID=$GITHUB_RUN_ID"
            echo "GITHUB_RUN_ATTEMPT=$GITHUB_RUN_ATTEMPT"
            echo "GITHUB_SHA=$GITHUB_SHA"

            echo
            echo "=== RUNNER ==="
            echo "RUNNER_OS=$RUNNER_OS"
            echo "RUNNER_ARCH=$RUNNER_ARCH"
            echo "RUNNER_ENVIRONMENT=$RUNNER_ENVIRONMENT"
            echo "ImageOS=${ImageOS:-}"
            echo "ImageVersion=${ImageVersion:-}"

            echo
            echo "=== OS ==="
            cat /etc/os-release

            echo
            echo "=== KERNEL ==="
            uname -a

            echo
            echo "=== PTRACE ==="
            sysctl kernel.yama.ptrace_scope 2>&1 || true

            echo
            echo "=== TOOLS ==="
            echo "node $(node --version)"
            echo "npm $(npm --version)"
            echo "npm at $(command -v npm)"
            echo "system python3 $(python3 --version 2>&1)"
            command -v strace >/dev/null && strace --version | sed -n 1p || echo "strace not installed yet"

            echo
            echo "=== CPU ==="
            lscpu

            echo
            echo "=== MEMORY ==="
            free -h

            echo
            echo "=== FILESYSTEM ==="
            df -Th
          } > experiment-output/metadata/github-host.txt
          cat experiment-output/metadata/github-host.txt

      - name: Verify strace works on the runner
        run: |
          sudo apt-get update
          sudo apt-get install -y strace
          strace --version | sed -n 1p
          trace="$RUNNER_TEMP/strace-check.trace"
          if ! strace -f -o "$trace" /bin/echo "hello"; then
            echo "::error::strace could not trace /bin/echo on this runner; Packj --trace cannot work here"
            exit 1
          fi
          if ! test -s "$trace" || ! grep -q 'execve("/bin/echo"' "$trace"; then
            echo "::error::strace ran but produced no usable trace"
            exit 1
          fi
          echo "strace prerequisite OK ($(wc -l < "$trace") lines)"
          rm -f "$trace"

      - name: Select Python 3.10 from the runner tool cache
        id: python
        run: |
          # Packj pins Python packages from 2020-2022 (e.g. PyYAML 6.0,
          # protobuf 3.19.4) that do not install on Ubuntu 24.04's Python 3.12.
          # Upstream's Dockerfile uses Ubuntu 22.04, i.e. Python 3.10.
          py=$(ls -d "$RUNNER_TOOL_CACHE"/Python/3.10.*/x64/bin/python3.10 2>/dev/null | sort -V | tail -1)
          if [ -z "$py" ]; then
            echo "::error::No Python 3.10 in $RUNNER_TOOL_CACHE/Python"
            ls "$RUNNER_TOOL_CACHE/Python" || true
            exit 1
          fi
          "$py" --version
          echo "path=$py" >> "$GITHUB_OUTPUT"

      - name: Install Packj dependencies
        run: |
          # python-magic needs libmagic (upstream's Dockerfile installs libmagic-dev).
          sudo apt-get install -y libmagic1t64
          bash experiments/packj/install-packj.sh \
            "${{ steps.python.outputs.path }}" \
            "$RUNNER_TEMP/packj-build" \
            2>&1 | tee experiment-output/packj/logs/packj-install.log

      - name: Verify Packj CLI
        run: |
          build="$RUNNER_TEMP/packj-build"
          py="$build/venv/bin/python"
          cd "$build/packj"
          "$py" --version
          "$py" -c 'from packj import __version__; print("Packj", __version__)'
          "$py" main.py audit --help | tee "$GITHUB_WORKSPACE/experiment-output/packj/logs/packj-audit-help.txt"
          grep -q -- '--trace' "$GITHUB_WORKSPACE/experiment-output/packj/logs/packj-audit-help.txt" \
            || { echo "::error::packj audit has no --trace option"; exit 1; }
          test -f "$HOME/.packj.yaml" || { echo "::error::~/.packj.yaml missing"; exit 1; }
          "$py" -c 'import magic, django, yaml, esprima' \
            || { echo "::error::Packj Python dependencies do not import"; exit 1; }

          # The patched trace stage must build an npm command for a local tarball.
          cmd=$("$py" -c 'from packj.audit.pm_util import get_pm_install_cmd; from packj.util.enum_util import PackageManagerEnum as E; print(get_pm_install_cmd(E.local_nodejs, "/x/p.tgz", "0.1.0"))')
          echo "local_nodejs install command: $cmd"
          if [ "$cmd" != "npm install --silent --no-progress --no-update-notifier /x/p.tgz" ]; then
            echo "::error::Unexpected local_nodejs install command: $cmd"
            exit 1
          fi

      - name: Locate environment probe package
        id: probe_pkg
        run: |
          # Same tarball Experiment A installs via package.json's file: dependency.
          tarball=packages/npm-probing-package-0.1.0.tgz
          test -f "$tarball" || { echo "::error::$tarball not found"; exit 1; }
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"

      - name: Validate probe package
        run: |
          tarball="${{ steps.probe_pkg.outputs.tarball }}"
          sha256sum "$tarball"
          dep=$(jq -r '.dependencies["npm-probing-package"]' package.json)
          if [ "$dep" != "file:$tarball" ]; then
            echo "::error::Experiment A installs '$dep', not $tarball"
            exit 1
          fi
          manifest=$(tar -xOzf "$tarball" package/package.json)
          echo "$manifest" | jq '{name, version, scripts: {postinstall: .scripts.postinstall}, engines}'
          echo "$manifest" | jq -e '.name == "npm-probing-package" and .version == "0.1.0"' >/dev/null \
            || { echo "::error::$tarball is not npm-probing-package@0.1.0"; exit 1; }
          echo "$manifest" | jq -e '.scripts.postinstall == "node scripts/postinstall.js"' >/dev/null \
            || { echo "::error::$tarball has an unexpected postinstall script"; exit 1; }
          # grep without -q reads all of tar's output: with pipefail, grep -q exiting early
          # makes tar die of SIGPIPE (141) and the check fail although the file exists.
          tar -tzf "$tarball" | grep -x 'package/scripts/postinstall.js' >/dev/null \
            || { echo "::error::$tarball does not contain scripts/postinstall.js"; exit 1; }

      - name: Run Packj audit --trace
        id: packj
        run: |
          bash experiments/packj/run-packj-trace.sh \
            "$RUNNER_TEMP/packj-build" \
            "${{ steps.probe_pkg.outputs.tarball }}" \
            experiment-output

      - name: Verify Packj audit
        if: ${{ !cancelled() && steps.packj.conclusion != 'skipped' }}
        run: bash experiments/packj/verify-packj-run.sh packj experiment-output

      - name: Verify probe output
        if: ${{ !cancelled() && steps.packj.conclusion != 'skipped' }}
        run: bash experiments/packj/verify-packj-run.sh probe experiment-output "$(npm --version)"

      - name: Verify Packj trace output
        if: ${{ !cancelled() && steps.packj.conclusion != 'skipped' }}
        run: bash experiments/packj/verify-packj-run.sh trace experiment-output

      - name: Write run metadata
        if: always()
        env:
          EXPERIMENT_ENV_ID: ENV-UNASSIGNED
          EXPERIMENT_ENV_NAME: github-actions-ubuntu-packj-audit-trace
          EXPERIMENT_STUDY_ROLE: "Packj audit --trace analysis condition; paired with the GitHub Actions Ubuntu VM baseline (probe.yml)"
          EXPERIMENT_RUNNER: ubuntu-24.04
        run: |
          bash experiments/packj/write-metadata.sh \
            experiment-output \
            "$RUNNER_TEMP/packj-build" \
            packages/npm-probing-package-0.1.0.tgz

          {
            echo "### Packj trace experiment checks"
            echo
            echo "| Check | Result |"
            echo "| --- | --- |"
            for f in experiment-output/metadata/checks/*.json; do
              [ -f "$f" ] || continue
              jq -r '.results[] | "| \(.check) | \(if .passed then "pass" else "**FAIL**" end) |"' "$f"
            done
            echo
            echo "Experiment valid: $(jq '.outcome.experiment_valid' experiment-output/metadata/experiment.json)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload experiment results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: github-actions-ubuntu-packj-trace-${{ github.run_id }}-${{ github.run_attempt }}
          path: experiment-output/
          if-no-files-found: warn
