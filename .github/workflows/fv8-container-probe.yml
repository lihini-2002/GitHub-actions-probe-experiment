name: Environment Probe - GitHub Ubuntu container job + FV8

# Experiment B: GitHub-hosted ubuntu-24.04 VM -> GitHub Actions job container
# (ubuntu:24.04, pinned) -> Node.js main@07f481cf built *in the container*
# (+ FV8 V8 patch | unmodified control) -> npm install <probe tarball>
# --foreground-scripts -> postinstall on that runtime -> probe.
#
# Same steps, scripts (experiments/fv8/, unchanged), pins and defaults as the
# hosted-VM experiment (fv8-probe.yml / fv8-control-probe.yml via
# fv8-node-experiment.yml). Differences, all caused by the container layer, are
# marked "CONTAINER:" below and listed in docs/fv8-container-setup.md.
#
# As in the VM experiment, no job-level `env:` is set and nothing is written to
# $GITHUB_ENV: npm and the probe inherit the step environment.

on:
  workflow_dispatch:
    inputs:
      variant:
        description: >-
          fv8: Node.js with FV8's V8 patch. control: the same build without it
          (matched control, also inside the container).
        type: choice
        options:
          - fv8
          - control
        default: fv8
      npm_host:
        description: Same meaning and default as the VM experiment (fv8-node = npm runs on the experiment runtime)
        type: choice
        options:
          - fv8-node
          - system-node
        default: fv8-node
      v8_options:
        description: Same as the VM experiment (--no-lazy = the authors' README example)
        type: choice
        options:
          - --no-lazy
          - none
        default: --no-lazy
      node_snapshot:
        description: Same as the VM experiment
        type: choice
        options:
          - snapshot
          - no-snapshot
        default: snapshot
      fv8_fixes:
        description: >-
          none: FV8's patch exactly as released (the Node.js build crashed in
          node_mksnapshot with it, run 38494602753). property-case: also apply
          the one-line researcher fix experiments/fv8/patches/fv8-astnode-property-case.patch
          (fv8 variant only; recorded as a deviation).
        type: choice
        options:
          - none
          - property-case
        default: none
      rebuild_runtime:
        description: Ignore the cached container-built runtime and rebuild Node.js from source (~70-80 min)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  fv8-container:
    # Same outer runner as the VM experiment.
    runs-on: ubuntu-24.04
    timeout-minutes: 340

    # CONTAINER: a GitHub Actions job container. ubuntu:24.04 matches the OS,
    # glibc, GCC 13 and Python 3.12 the VM experiment built and ran with.
    # Pinned to the linux/amd64 platform manifest of ubuntu:24.04
    # (index sha256:534baea6a22c03a63003dbc8dbe78fe34bc0d7e595d9a9dc9834884ff530eb55
    # when pinned). No extra `options:` (no added mounts, privileges or limits).
    container:
      image: ubuntu:24.04@sha256:f610ab94648195aa356059f5b41d6085c9d4d903c072430cdd1af7bdb646106b

    defaults:
      run:
        # CONTAINER: container jobs default to `sh`; the scripts are Bash.
        shell: bash

    steps:
      # CONTAINER: the image has none of the runner's preinstalled tools. This
      # list is what experiments/fv8/*.sh, actions/checkout and
      # actions/setup-node call, nothing more:
      #   git, ca-certificates   checkout, submodule, Node.js source fetch
      #   python3                Node.js configure/gyp, binary inspection
      #   g++, make              Node.js build (the VM uses its preinstalled GCC 13)
      #   patch                  applying the FV8 patch
      #   jq                     metadata and checks
      #   xz-utils               setup-node archive extraction
      #   procps                 free/ps in environment records
      # (dpkg-deb, tar, gzip, coreutils, findutils, util-linux are in the image.)
      - name: Install experiment dependencies into the job container
        run: |
          {
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              git ca-certificates python3 g++ make patch jq xz-utils procps
            echo
            echo "=== installed versions ==="
            dpkg-query -W -f='${Package} ${Version}\n' git ca-certificates python3 g++ gcc make patch jq xz-utils procps
          } 2>&1 | tee "$RUNNER_TEMP/container-setup.log"

      - name: Checkout repository
        uses: actions/checkout@v4

      # CONTAINER: the workspace is owned by the runner's uid on the host and
      # the container runs as root, so git would refuse it ("dubious
      # ownership"). safe.directory is passed through GIT_CONFIG_* on the steps
      # that run git, instead of writing ~/.gitconfig (the probe records whether
      # that file exists). The probe-install step does not get these variables.
      - name: Fetch pinned FV8 sources
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: safe.directory
          GIT_CONFIG_VALUE_0: "*"
        run: git submodule update --init --depth 1 tools/fv8

      - name: Verify pinned FV8 sources
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: safe.directory
          GIT_CONFIG_VALUE_0: "*"
        run: |
          expected=57fc2b2699563316958603934aba572907171162
          actual=$(git -C tools/fv8 rev-parse HEAD)
          if [ "$actual" != "$expected" ]; then
            echo "::error::tools/fv8 is at $actual, expected $expected"
            exit 1
          fi
          echo "tools/fv8 @ $actual"
          echo "6dc767202b59eb770feeea27135ffd9455b4b6b2f1f0b9e97752de34880a3c39  tools/fv8/patches/V8_patch_122.diff" | sha256sum -c -

      - name: Validate inputs
        id: cfg
        run: |
          case "${{ inputs.variant }}" in
            fv8)     experiment=fv8-container ;;
            control) experiment=fv8-container-control ;;
            *) echo "::error::variant must be fv8 or control"; exit 1 ;;
          esac
          case "${{ inputs.npm_host }}" in fv8-node|system-node) ;; *) echo "::error::bad npm_host"; exit 1 ;; esac
          case "${{ inputs.v8_options }}" in --no-lazy|none) ;; *) echo "::error::bad v8_options"; exit 1 ;; esac
          case "${{ inputs.node_snapshot }}" in snapshot|no-snapshot) ;; *) echo "::error::bad node_snapshot"; exit 1 ;; esac
          case "${{ inputs.fv8_fixes }}" in none|property-case) ;; *) echo "::error::bad fv8_fixes"; exit 1 ;; esac
          if [ "${{ inputs.variant }}" = control ] && [ "${{ inputs.fv8_fixes }}" != none ]; then
            echo "::error::fv8_fixes applies to the fv8 variant only; use none for the control"; exit 1
          fi
          out="results/$experiment/$GITHUB_RUN_ID"
          mkdir -p "$out/logs" "$out/probe" "$out/checks" "$out/fv8" "$out/install" "$out/container"
          cp "$RUNNER_TEMP/container-setup.log" "$out/logs/container-setup.log"
          echo "experiment=$experiment" >> "$GITHUB_OUTPUT"
          echo "out=$out" >> "$GITHUB_OUTPUT"
          echo "runtime=$RUNNER_TEMP/node-runtime" >> "$GITHUB_OUTPUT"
          echo "Results: $out"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Record outer environment (before any FV8/control runtime)
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: safe.directory
          GIT_CONFIG_VALUE_0: "*"
        run: |
          bash experiments/fv8/record-environment.sh \
            "${{ steps.cfg.outputs.out }}" \
            "${{ inputs.variant }}" \
            "Node.js main@07f481cf built from source inside the job container (variant ${{ inputs.variant }}); reused from actions/cache when an entry built in the same pinned container image with identical pinned inputs exists"

      # CONTAINER: layer snapshot (OS, PID 1, cgroup, mounts, markers).
      - name: Record job-container layer (before build)
        run: bash experiments/fv8-container/record-container-layer.sh "${{ steps.cfg.outputs.out }}" before-build

      - name: Inspect the authors' released FV8 build (not executed)
        run: |
          bash experiments/fv8/inspect-fv8-release.sh \
            "${{ steps.cfg.outputs.out }}" \
            "$RUNNER_TEMP/fv8-release"

      # CONTAINER: separate key namespace, so a runtime built on the hosted VM
      # can never be restored here; the image digest is part of the key.
      - name: Compute runtime cache key
        id: key
        run: |
          echo "key=node-runtime-v1-container-ubuntu24.04-f610ab946481-${{ inputs.variant }}-v8opts_${{ inputs.v8_options == '--no-lazy' && 'nolazy' || 'none' }}-${{ inputs.node_snapshot }}-fixes_${{ inputs.fv8_fixes }}-${{ hashFiles('experiments/fv8/build-node-runtime.sh', 'experiments/fv8/compat/**', 'experiments/fv8/patches/**', 'tools/fv8/patches/V8_patch_122.diff') }}" >> "$GITHUB_OUTPUT"

      - name: Restore runtime from cache
        id: cache
        if: ${{ !inputs.rebuild_runtime }}
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.cfg.outputs.runtime }}
          key: ${{ steps.key.outputs.key }}

      # CONTAINER: built in the container's $RUNNER_TEMP (/__w/_temp). The VM
      # job uses `sudo` and /mnt, which the container has neither of.
      - name: Build Node.js runtime (${{ inputs.variant }}) inside the job container
        id: build
        if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: safe.directory
          GIT_CONFIG_VALUE_0: "*"
        run: |
          work="$RUNNER_TEMP/node-build"
          df -h / "$RUNNER_TEMP"
          log="$RUNNER_TEMP/setup-build.log"
          bash experiments/fv8/build-node-runtime.sh \
            "${{ inputs.variant }}" \
            "$work" \
            "${{ steps.cfg.outputs.runtime }}" \
            "${{ inputs.v8_options }}" \
            "${{ inputs.node_snapshot }}" \
            "${{ inputs.fv8_fixes }}" \
            2>&1 | tee "$log"
          cp "$log" "${{ steps.cfg.outputs.runtime }}/fv8-experiment/build.log"
          # Evidence that this build ran in the job container; stored with the
          # runtime so it is restored with it from the cache.
          bash experiments/fv8-container/record-container-layer.sh \
            "${{ steps.cfg.outputs.runtime }}/fv8-experiment" runtime-build

      - name: Save runtime to cache
        if: ${{ steps.build.outcome == 'success' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.cfg.outputs.runtime }}
          key: ${{ steps.key.outputs.key }}

      - name: Collect setup/build log
        if: always()
        run: |
          out="${{ steps.cfg.outputs.out }}"
          rt="${{ steps.cfg.outputs.runtime }}"
          if [ -f "$rt/fv8-experiment/build.log" ]; then
            cp "$rt/fv8-experiment/build.log" "$out/logs/setup-build.log"
          elif [ -f "$RUNNER_TEMP/setup-build.log" ]; then
            cp "$RUNNER_TEMP/setup-build.log" "$out/logs/setup-build.log"
          fi
          for f in json txt; do
            [ -f "$rt/fv8-experiment/container/runtime-build.$f" ] && cp "$rt/fv8-experiment/container/runtime-build.$f" "$out/container/"
          done
          echo "cache-hit: ${{ steps.cache.outputs.cache-hit == 'true' }}" > "$out/logs/runtime-source.txt"
          echo "cache-key: ${{ steps.key.outputs.key }}" >> "$out/logs/runtime-source.txt"

      - name: Runtime self-test (versions, FV8 code, forced-execution canary)
        id: selftest
        run: |
          bash experiments/fv8/run-runtime-selftest.sh \
            "${{ steps.cfg.outputs.runtime }}" \
            "${{ steps.cfg.outputs.out }}" \
            "$RUNNER_TEMP/selftest"

      - name: Verify runtime
        run: |
          bash experiments/fv8/verify-fv8-run.sh runtime \
            "${{ steps.cfg.outputs.out }}" "${{ inputs.variant }}" "${{ inputs.v8_options }}"

      - name: Locate environment probe package
        id: probe_pkg
        run: |
          # Same tarball as the baseline and the VM FV8 experiment.
          tarball=packages/npm-probing-package-0.1.0.tgz
          test -f "$tarball" || { echo "::error::$tarball not found"; exit 1; }
          sha256sum "$tarball"
          dep=$(jq -r '.dependencies["npm-probing-package"]' package.json)
          if [ "$dep" != "file:$tarball" ]; then
            echo "::error::The baseline installs '$dep', not $tarball"
            exit 1
          fi
          manifest=$(tar -xOzf "$tarball" package/package.json)
          echo "$manifest" | jq -e '.name == "npm-probing-package" and .version == "0.1.0"' >/dev/null \
            || { echo "::error::$tarball is not npm-probing-package@0.1.0"; exit 1; }
          echo "$manifest" | jq -e '.scripts.postinstall == "node scripts/postinstall.js"' >/dev/null \
            || { echo "::error::$tarball has an unexpected postinstall script"; exit 1; }
          mkdir -p "$RUNNER_TEMP/probe-input"
          cp "$tarball" "$RUNNER_TEMP/probe-input/"
          echo "tarball=$RUNNER_TEMP/probe-input/$(basename "$tarball")" >> "$GITHUB_OUTPUT"

      - name: Smoke test - canary package through npm lifecycle
        id: smoke
        run: |
          npm pack ./experiments/fv8/smoke-package --pack-destination "$RUNNER_TEMP"
          had_npm_dir=false; [ -e "$HOME/.npm" ] && had_npm_dir=true
          out="${{ steps.cfg.outputs.out }}/install/smoke"
          status=0
          bash experiments/fv8/run-npm-install.sh \
            "${{ steps.cfg.outputs.runtime }}" \
            "${{ inputs.npm_host }}" \
            "$RUNNER_TEMP/lifecycle-smoke-package-1.0.0.tgz" \
            "$RUNNER_TEMP/install-smoke" \
            "$out" \
            lifecycle-smoke-package \
            "$out/report" || status=$?
          # Leave no smoke-test state where the probe could observe it.
          rm -rf "$RUNNER_TEMP/install-smoke" "$RUNNER_TEMP/lifecycle-smoke-package-1.0.0.tgz"
          if [ "$had_npm_dir" = false ]; then rm -rf "$HOME/.npm"; fi
          exit "$status"

      - name: Verify smoke test
        if: ${{ !cancelled() && steps.smoke.conclusion != 'skipped' }}
        run: bash experiments/fv8/verify-fv8-run.sh smoke "${{ steps.cfg.outputs.out }}" "${{ inputs.variant }}"

      # CONTAINER: layer snapshot from the step that runs npm, just before it.
      - name: Record job-container layer (before probe)
        run: bash experiments/fv8-container/record-container-layer.sh "${{ steps.cfg.outputs.out }}" before-probe

      - name: Install environment probe through npm (lifecycle under ${{ inputs.variant }} runtime)
        id: probe_install
        run: |
          bash experiments/fv8/run-npm-install.sh \
            "${{ steps.cfg.outputs.runtime }}" \
            "${{ inputs.npm_host }}" \
            "${{ steps.probe_pkg.outputs.tarball }}" \
            "$RUNNER_TEMP/install-probe" \
            "${{ steps.cfg.outputs.out }}/install/probe" \
            npm-probing-package \
            "${{ steps.cfg.outputs.out }}/probe"

      - name: Verify probe execution
        if: ${{ !cancelled() && steps.probe_install.conclusion != 'skipped' }}
        run: bash experiments/fv8/verify-fv8-run.sh probe "${{ steps.cfg.outputs.out }}" "${{ inputs.variant }}"

      # CONTAINER: build, runtime, npm and the probe ran in the job container.
      - name: Verify execution inside the job container
        if: ${{ !cancelled() && steps.probe_install.conclusion != 'skipped' }}
        run: bash experiments/fv8-container/verify-container-layer.sh "${{ steps.cfg.outputs.out }}" 24.04

      - name: Write metadata, classification and manifest
        if: always()
        env:
          JOB_CONTAINER_ID: ${{ job.container.id }}
        run: |
          out="${{ steps.cfg.outputs.out }}"
          bash experiments/fv8/write-metadata.sh \
            "$out" \
            "${{ inputs.variant }}" \
            "${{ inputs.npm_host }}" \
            "${{ inputs.v8_options }}" \
            "${{ steps.cache.outputs.cache-hit == 'true' }}" \
            packages/npm-probing-package-0.1.0.tgz
          # CONTAINER: add the job-container layer to the same schema.
          bash experiments/fv8-container/write-container-metadata.sh \
            "$out" \
            "${{ inputs.variant }}" \
            ubuntu-24.04 \
            "ubuntu:24.04" \
            "sha256:f610ab94648195aa356059f5b41d6085c9d4d903c072430cdd1af7bdb646106b"

      - name: Check results for credential-like strings
        if: always()
        run: |
          # Same check as the VM experiment.
          out="${{ steps.cfg.outputs.out }}"
          pattern='gh[pousr]_[A-Za-z0-9]{36,}|github_pat_[A-Za-z0-9_]{40,}|AKIA[0-9A-Z]{16}|ASIA[0-9A-Z]{16}|npm_[A-Za-z0-9]{36}|-----BEGIN [A-Z ]*PRIVATE KEY-----|xox[abprs]-[A-Za-z0-9-]{10,}'
          : > "$out/logs/credential-scan.txt"
          while IFS= read -r -d '' f; do
            if [[ "$f" == *.gz ]]; then
              zcat "$f" | grep -qaE "$pattern" || continue
            else
              grep -qaE "$pattern" "$f" || continue
            fi
            echo "removed: ${f#"$out"/}" | tee -a "$out/logs/credential-scan.txt"
            rm -f "$f"
          done < <(find "$out" -type f -not -name credential-scan.txt -print0)
          if [ -s "$out/logs/credential-scan.txt" ]; then
            echo "::warning::Files with credential-like strings were removed from the upload; see logs/credential-scan.txt"
          else
            echo "no credential-like strings found" | tee "$out/logs/credential-scan.txt"
          fi

      - name: Summarize run
        if: always()
        run: |
          out="${{ steps.cfg.outputs.out }}"
          {
            echo "### ${{ steps.cfg.outputs.experiment }} experiment checks"
            echo
            echo "| Check | Result |"
            echo "| --- | --- |"
            for f in "$out"/checks/*.json; do
              [ -f "$f" ] || continue
              jq -r '.results[] | "| \(.check) | \(if .passed then "pass" else "**FAIL**" end) |"' "$f"
            done
            echo
            echo "Harness label: \`$(jq -r .label "$out/harness-classification.json" 2>/dev/null)\`"
            echo
            echo "Experiment valid (incl. container layer): $(jq -r .experiment_valid "$out/experiment-manifest.json" 2>/dev/null)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload experiment results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.cfg.outputs.experiment }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: results/
          if-no-files-found: warn
